<header class="fixed top-0 inset-x-0 z-40 px-3 sm:px-4 pt-3 sm:pt-4 transBg">
    <div class="global-container mx-auto">
        <div class="glass rounded-2xl px-4 sm:px-6 py-3 flex items-center justify-between shadow-[0_10px_40px_-18px_rgba(0,0,0,0.8)]"
            [class.rounded-b-none]="isMenuOpen">
            <div [routerLink]="['/', i18n.current]" class="cursor-pointer shrink-0">
                <img (click)="closeMenu()" class="w-28 sm:w-32" alt="logo" src="images/Logo2.svg">
            </div>

            <nav class="lg:flex hidden items-center gap-1 text-[15px] font-medium">
                <div [routerLink]="['/', i18n.current]"
                    class="px-4 py-2 rounded-full text-primaryWhite/75 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">
                    {{ 'nav.home' | translate }}
                </div>
                <div [routerLink]="['/', i18n.current, 'about-me']" routerLinkActive="active"
                    class="px-4 py-2 rounded-full text-primaryWhite/75 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">
                    {{ 'nav.about' | translate }}
                </div>
                <div [routerLink]="['/', i18n.current, 'my-works']" routerLinkActive="active"
                    class="px-4 py-2 rounded-full text-primaryWhite/75 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">
                    {{ 'nav.works' | translate }}
                </div>
                <div [routerLink]="['/', i18n.current, 'contact-me']" routerLinkActive="active"
                    class="px-4 py-2 rounded-full text-primaryWhite/75 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">
                    {{ 'nav.contact' | translate }}
                </div>
            </nav>

            <div class="flex items-center gap-2 shrink-0">
                <button (click)="switchLang()"
                    class="hidden lg:inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-white/15 bg-white/5 text-sm font-semibold text-primaryWhite/90 hover:text-white hover:border-primary hover:bg-primary/15 duration-200 cursor-pointer">
                    <img class="w-4 opacity-80" src="images/lang.svg">
                    <span>{{ i18n.current === 'en' ? 'AR' : 'EN' }}</span>
                </button>
                <img (click)="toggleMen()"
                    class="lg:hidden block cursor-pointer duration-200 hover:scale-110 w-6" alt="menu" #menuHamb
                    [src]="this.isMenuOpen ? 'images/close_w.svg' : 'images/hamb_w.svg'">
            </div>
        </div>

        <div class="menuToOpen hidden lg:hidden mt-2 glass rounded-2xl p-3 flex flex-col gap-1 text-center duration-200">
            <div (click)="closeMenu()" [routerLink]="['/', i18n.current]"
                class="py-3 rounded-xl text-primaryWhite/80 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">{{ 'nav.home' | translate }}</div>
            <div (click)="closeMenu()" [routerLink]="['/', i18n.current, 'about-me']" routerLinkActive="active"
                class="py-3 rounded-xl text-primaryWhite/80 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">{{ 'nav.about' | translate }}</div>
            <div (click)="closeMenu()" [routerLink]="['/', i18n.current, 'my-works']" routerLinkActive="active"
                class="py-3 rounded-xl text-primaryWhite/80 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">{{ 'nav.works' | translate }}</div>
            <div (click)="closeMenu()" [routerLink]="['/', i18n.current, 'contact-me']" routerLinkActive="active"
                class="py-3 rounded-xl text-primaryWhite/80 hover:text-white hover:bg-white/5 duration-200 cursor-pointer">{{ 'nav.contact' | translate }}</div>
            <button (click)="switchLang()"
                class="mt-1 inline-flex items-center justify-center gap-2 py-3 rounded-xl border border-white/15 bg-white/5 text-sm font-semibold text-primaryWhite/90 hover:text-white hover:border-primary duration-200 cursor-pointer">
                <img class="w-4 opacity-80" src="images/lang.svg">
                <span>{{ i18n.current === 'en' ? 'AR' : 'EN' }}</span>
            </button>
        </div>
    </div>
</header>
