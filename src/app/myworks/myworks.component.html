<section class="pt-36 pb-24 min-h-custom">
    <div class="global-container mx-auto flex flex-col items-center">
        <span class="kicker" appReveal>{{ 'nav.works' | translate }}</span>
        <div class="common-headers text-4xl sm:text-5xl mt-4" appReveal>
            <p>{{ 'works.title' | translate }}</p>
            <div></div>
        </div>

        <div class="grid lg:grid-cols-2 grid-cols-1 gap-6 mt-16 w-full">
            @for(work of worksArray; track work){
            <div class="card overflow-hidden group" [appReveal]="$index * 70">
                <div class="relative overflow-hidden">
                    <img loading="lazy" class="w-full aspect-[16/10] object-cover group-hover:scale-[1.04] duration-500" [src]="work.image" [alt]="work.name">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/15 to-transparent"></div>
                    <h3 class="absolute bottom-4 inset-x-5 text-xl font-bold text-white">{{ work.name }}</h3>
                </div>
                <div class="p-4 flex items-center gap-3">
                    <a [href]="work.link" target="_blank" class="btn btn-primary flex-1 text-sm !py-2.5 !px-4">
                        <span>{{ 'works.visit' | translate }}</span>
                        <svg class="w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
                    </a>
                    <div [routerLink]="['/', i18n.current, 'my-works', work.id]" class="btn btn-ghost flex-1 text-sm !py-2.5 !px-4 cursor-pointer">
                        {{ 'works.details' | translate }}
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
