<div class="py-28 min-h-custom flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="common-headers text-primary text-4xl font-semibold w-fit mx-auto">
            <p>{{ 'adminLogin.title' | translate }}</p>
            <div></div>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="mt-16 flex flex-col gap-5">
            <div class="flex flex-col gap-1">
                <label class="pl-1 text-sm text-primaryWhite/70" for="adminEmail">{{ 'adminLogin.email' | translate }}</label>
                <input id="adminEmail" type="email" formControlName="email" autocomplete="username"
                    class="w-full bg-transparent border-b border-white/40 rounded-sm px-2 py-2 text-base focus:outline-none focus:border-primary duration-200">
            </div>

            <div class="flex flex-col gap-1">
                <label class="pl-1 text-sm text-primaryWhite/70" for="adminPassword">{{ 'adminLogin.password' | translate }}</label>
                <input id="adminPassword" type="password" formControlName="password" autocomplete="current-password"
                    class="w-full bg-transparent border-b border-white/40 rounded-sm px-2 py-2 text-base focus:outline-none focus:border-primary duration-200">
            </div>

            @if(failed){
                <div class="text-red-400 text-sm">{{ 'adminLogin.error' | translate }}</div>
            }
            @if(notAuthorized){
                <div class="text-red-400 text-sm">{{ 'adminLogin.notAuthorized' | translate }}</div>
            }

            <button type="submit" [disabled]="loading || googleLoading"
                class="bg-primary px-5 py-2 text-center rounded-md mt-4 cursor-pointer duration-200 hover:bg-lighterPrimary hover:scale-105 text-white disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
                {{ (loading ? 'adminLogin.signingIn' : 'adminLogin.submit') | translate }}
            </button>
        </form>

        <div class="flex items-center gap-3 my-6 text-primaryWhite/40 text-sm">
            <span class="h-px bg-white/15 flex-1"></span>
            <span>{{ 'adminLogin.or' | translate }}</span>
            <span class="h-px bg-white/15 flex-1"></span>
        </div>

        <button type="button" (click)="signInWithGoogle()" [disabled]="loading || googleLoading"
            class="w-full flex items-center justify-center gap-3 px-5 py-2.5 rounded-md border border-white/20 bg-white/5 hover:bg-white/10 duration-200 disabled:opacity-60 disabled:cursor-not-allowed">
            <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span>{{ (googleLoading ? 'adminLogin.signingIn' : 'adminLogin.google') | translate }}</span>
        </button>
    </div>
</div>
