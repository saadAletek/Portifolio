<section class="pt-36 pb-24 min-h-custom">
    <div class="global-container mx-auto">
        <div class="flex items-center gap-4 mb-10" appReveal>
            <button (click)="goBack()" aria-label="back"
                class="w-11 h-11 rounded-full glass grid place-items-center hover:border-primary hover:bg-primary/15 hover:-translate-x-1 rtl:hover:translate-x-1 duration-200 shrink-0">
                <svg class="w-5 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </button>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight">{{ work.name }}</h1>
        </div>

        <div class="text-lg leading-relaxed text-primaryWhite/80 [&_img]:rounded-2xl [&_img]:my-6 [&_a]:text-primary [&_a:hover]:text-lighterPrimary"
            [innerHTML]="work.details" appReveal></div>
    </div>
</section>
