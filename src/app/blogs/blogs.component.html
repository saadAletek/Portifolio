<section class="pt-36 pb-24 min-h-custom">
    <div class="global-container mx-auto flex flex-col items-center">
        <span class="kicker" appReveal>{{ 'nav.blogs' | translate }}</span>
        <div class="common-headers text-4xl sm:text-5xl mt-4" appReveal>
            <p>{{ 'blogs.title' | translate }}</p>
            <div></div>
        </div>

        @if(blogsArray.length === 0){
            <div class="card !rounded-3xl mt-14 px-8 py-16 text-center max-w-md w-full" appReveal>
                <div class="text-5xl mb-4 opacity-40">✦</div>
                <div class="text-primaryWhite/60 text-lg">{{ 'blogs.empty' | translate }}</div>
            </div>
        }

        <div class="grid lg:grid-cols-2 grid-cols-1 gap-6 mt-16 w-full">
            @for(work of blogsArray; track work){
            <div [routerLink]="['/', i18n.current, 'blogs', work.id]" class="card overflow-hidden group cursor-pointer" [appReveal]="$index * 70">
                <div class="relative overflow-hidden">
                    <img loading="lazy" class="w-full aspect-[16/10] object-cover group-hover:scale-[1.04] duration-500" [src]="work.image" [alt]="work.name">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
                </div>
                <div class="p-5 flex items-center justify-between gap-3">
                    <h3 class="text-lg font-bold">{{ work.name }}</h3>
                    <svg class="w-5 text-lighterPrimary rtl:rotate-180 group-hover:translate-x-1 rtl:group-hover:-translate-x-1 duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </div>
            </div>
            }
        </div>
    </div>
</section>
